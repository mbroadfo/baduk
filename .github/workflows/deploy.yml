name: Deploy to S3

# Manual by default. Flip to `push: branches: [main]` once the AWS side exists
# and you actually want every merge to go live.
on:
  workflow_dispatch:
    inputs:
      invalidate:
        description: 'Invalidate the CloudFront cache after syncing'
        type: boolean
        default: true

permissions:
  id-token: write # for OIDC — no long-lived AWS keys in GitHub secrets
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build --workspace @baduk/web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Hashed assets are immutable and can be cached hard; index.html must not
      # be, or visitors keep loading an old app against new assets.
      - name: Sync hashed assets
        run: |
          aws s3 sync apps/web/dist s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync index.html
        run: |
          aws s3 cp apps/web/dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        if: ${{ inputs.invalidate && vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
