name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the SPA
        run: npm run build --workspace @baduk/web

      # A quick bot-vs-bot run exercises the engine over a few thousand moves,
      # which catches rule bugs that unit tests with hand-built shapes miss.
      - name: Smoke test the engine via self-play
        run: npm run arena -- --black sprout --white pebble --games 3 --size 9

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
